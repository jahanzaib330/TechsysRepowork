<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">
            User Data
        </h1>
        <div class="row" id="userContainer">
            <!-- cards javascript se yaha ayenge -->
        </div>
    </div>

    <script>
        fetch("app.json")
        .then(response =>response.json())
        .then(users => {
            var container = document.getElementById("userContainer")

            users.forEach(result =>{
                container.innerHTML += `
                <div class="col-md-4 mb-4">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title">${result.Name}</h4>
                <p class="card-text"><b>UserId: ${result.id}</b>:</p>
                <p class="card-text"><b>Email: ${result.Email}</b>:</p>
            </div>
        </div>
    </div>
                `
            })
        })
    </script>
    
</body>
</html>
